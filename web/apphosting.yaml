# Firebase App Hosting backend settings (운영 실연동).
runConfig:
  minInstances: 1
  maxInstances: 20
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # --- 런타임(서버 라우트) ---
  - variable: OPENAI_MODEL
    value: gpt-5.2
  - variable: USE_MOCK_AI
    value: "false"
  # study-api 외부 연동 URL(개발 DB — 운영 API 준비되면 이 값만 교체)
  - variable: LEARNING_API_BASE_URL
    value: https://test-study-api.yoons.or.kr
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
  # --- 빌드+런타임(클라이언트 인라인) ---
  - variable: NEXT_PUBLIC_LEARNING_SOURCE
    value: external-api
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBcRa6ZfcISNNGmgHpeFeOXGubTSzV_Gmo
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: eduai-tutor-62825.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: eduai-tutor-62825
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: eduai-tutor-62825.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 435688058049
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:435688058049:web:064bbc7b273bead80df840
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_MODE
    value: anonymous
    availability:
      - BUILD
      - RUNTIME
  # --- AI 전화관리(call-review) ---
  # 시크릿은 Secret Manager에 있다(값은 문서·커밋에 적지 않는다). 순서: call-review/DEPLOY.md.
  - variable: CALL_REVIEW_SESSION_SECRET   # 모바일 토큰·교사 세션 서명/암호화 키
    secret: CALL_REVIEW_SESSION_SECRET
  - variable: CALL_REVIEW_CRON_SECRET      # 푸시 예약 작업 호출 인증값
    secret: CALL_REVIEW_CRON_SECRET
  - variable: CALL_REVIEW_FIRESTORE        # 통화 결과·일정을 운영 Firestore에 저장
    value: enabled
  - variable: STUDY_API_LOOKBACK_DAYS      # 오답 조회 기간(일). 기본 90일이면 지난 학기 차시가 빠진다.
    value: "365"
  - variable: AZURE_SPEECH_KEY             # 음성 인식(Azure Speech)
    secret: AZURE_SPEECH_KEY
  - variable: AZURE_SPEECH_REGION
    value: koreacentral
  - variable: GEMINI_API_KEY               # 읽어 주기(Gemini TTS). 기존 GEMINI_API_KEY 시크릿은 다른 서비스용이라 전용 시크릿을 쓴다.
    secret: CALL_REVIEW_GEMINI_API_KEY
  # 서버 푸시는 Cloud Scheduler 예약 작업을 만든 뒤에 켠다. 그 전에는 앱이 기기 자체 알림을 쓴다.
  # - variable: CALL_REVIEW_PUSH_DISPATCH
  #   value: enabled
  # - variable: CALL_REVIEW_FREE_TALK_MODEL  # (선택) 짧은 대화 질문용 더 빠른 모델
  #   value: <model>
