# Firebase App Hosting backend settings.
# Use minInstances > 0 for pilot/production to reduce cold starts.
runConfig:
  minInstances: 1
  maxInstances: 20
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  - variable: OPENAI_MODEL
    value: gpt-5.2
  - variable: USE_MOCK_AI
    value: "true"
  # study-api 외부 연동용 HTTPS 프록시(https://test-study-api.yoons.or.kr)가 열려
  # 배포(클라우드) 환경에서도 호출 가능. 실데이터 검증 후 external 전환:
  #   NEXT_PUBLIC_LEARNING_SOURCE=external-api
  #   LEARNING_API_BASE_URL=https://test-study-api.yoons.or.kr
  - variable: NEXT_PUBLIC_LEARNING_SOURCE
    value: mock
  # mock 파일럿 배포에는 아래 Secret이 필요 없음(USE_MOCK_AI=true).
  # OpenAI 실연동 시 Secret Manager에 생성 후 주석 해제:
  #   firebase apphosting:secrets:set OPENAI_API_KEY
  # - variable: OPENAI_API_KEY
  #   secret: OPENAI_API_KEY
  # - variable: LEARNING_API_KEY
  #   secret: LEARNING_API_KEY
