# Firebase App Hosting backend settings (운영 실연동).
runConfig:
  minInstances: 1
  maxInstances: 20
  concurrency: 80
  cpu: 1
  memoryMiB: 1024

env:
  # --- 런타임(서버 라우트) ---
  - variable: OPENAI_MODEL
    value: gpt-5.2
  - variable: USE_MOCK_AI
    value: "false"
  # study-api 외부 연동 URL(개발 DB — 운영 API 준비되면 이 값만 교체)
  - variable: LEARNING_API_BASE_URL
    value: https://test-study-api.yoons.or.kr
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
  # --- 빌드+런타임(클라이언트 인라인) ---
  - variable: NEXT_PUBLIC_LEARNING_SOURCE
    value: external-api
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyBcRa6ZfcISNNGmgHpeFeOXGubTSzV_Gmo
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: eduai-tutor-62825.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: eduai-tutor-62825
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: eduai-tutor-62825.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: 435688058049
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:435688058049:web:064bbc7b273bead80df840
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_MODE
    value: anonymous
    availability:
      - BUILD
      - RUNTIME
